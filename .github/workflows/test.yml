name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  game:
    name: build & test (game module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Build (client + server)
        run: go build ./...

      - name: Test
        run: go test ./... -v
