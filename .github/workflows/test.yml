name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  game:
    name: build & test (game module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Install raylib-go build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Vet
        run: go vet ./...

      - name: Build (client + server)
        run: go build ./...

      - name: Test
        run: go test ./... -v

  animaker:
    name: build (animaker module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: animaker/go.sum

      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Build
        working-directory: animaker
        run: go build ./...
